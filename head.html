<!DOCTYPE html>
<html lang="en" data-theme="">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Brightmind Academy | Show your working</title>
<style>
:root{--bg:#fafaf7;--surface:#fff;--text:#1b1f2a;--muted:#5c6475;--line:#e4e4dc;--accent:#2f5bea;--accent-t:#fff;--ok:#1a8f5a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10131a;--surface:#181c26;--text:#eceef4;--muted:#9aa3b5;--line:#2a3040;--accent:#7b9bff;--accent-t:#0b1020;--ok:#4cd694;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10131a;--surface:#181c26;--text:#eceef4;--muted:#9aa3b5;--line:#2a3040;--accent:#7b9bff;--accent-t:#0b1020;--ok:#4cd694;color-scheme:dark}
html{scroll-behavior:smooth;scroll-padding-top:calc(72px + env(safe-area-inset-top,0px))}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 system-ui,-apple-system,"Segoe UI","Noto Sans Bengali","Kalpurush",sans-serif}
a{color:inherit;text-decoration:none}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
.nav{display:flex;align-items:center;gap:16px;height:64px}
.logo{font-weight:800;font-size:20px;letter-spacing:-.02em}.logo span{color:var(--accent)}
.links{display:flex;gap:18px;margin-left:auto;font-size:15px;color:var(--muted)}
.links a:hover{color:var(--text)}
.btn{display:inline-block;border:1px solid var(--line);background:var(--surface);color:var(--text);padding:8px 14px;border-radius:10px;font:inherit;font-size:14px;cursor:pointer}
.btn.p{background:var(--accent);color:var(--accent-t);border-color:var(--accent);font-weight:600}
.tools{display:flex;gap:8px}
@media(max-width:820px){.links{display:none}.tools{margin-left:auto}}
section{padding:64px 0}
h1{font-size:clamp(34px,6vw,56px);line-height:1.1;letter-spacing:-.03em;margin:0 0 16px}
h2{font-size:clamp(26px,4vw,34px);letter-spacing:-.02em;margin:0 0 8px}
.sub{color:var(--muted);max-width:620px;margin:0 0 28px}
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:40px;align-items:center}
@media(max-width:820px){.hero{grid-template-columns:1fr}}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin-top:24px}
.pill{font-size:13px;padding:4px 12px;border:1px solid var(--line);border-radius:99px;color:var(--muted);background:var(--surface)}
.board{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;font-family:ui-monospace,Menlo,monospace;font-size:15px;line-height:2}
.board em{font-style:normal;color:var(--muted);font-size:13px;margin-left:8px}
.board .ok{color:var(--ok);font-weight:700}
.board .note{font-family:system-ui,"Noto Sans Bengali",sans-serif;border-top:1px dashed var(--line);margin-top:10px;padding-top:10px;font-size:14px;line-height:1.5}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:block}
.card h3{margin:0 0 6px;font-size:18px}.card p{margin:0 0 10px;color:var(--muted);font-size:14.5px}
.tag{font-size:12px;color:var(--accent);font-weight:600}
a.card:hover{border-color:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:24px 0}
@media(max-width:600px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;text-align:center}
.stat b{display:block;font-size:30px;color:var(--accent);line-height:1.2}.stat span{font-size:13px;color:var(--muted)}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
input[type=search]{flex:1 1 220px;padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--text);font:inherit;font-size:15px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--text);padding:7px 14px;border-radius:99px;font:inherit;font-size:14px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--accent);color:var(--accent-t);border-color:var(--accent)}
.mod .n{font-size:12px;color:var(--muted)}
.steps{counter-reset:s;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.step{counter-increment:s;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}
.step::before{content:counter(s);display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:var(--accent);color:var(--accent-t);font-weight:700;margin-bottom:10px}
.step h3{margin:0 0 6px;font-size:17px}.step p{margin:0 0 8px;color:var(--muted);font-size:14.5px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px;display:flex;flex-wrap:wrap;gap:20px;align-items:center;justify-content:space-between}
.avatar{width:56px;height:56px;border-radius:50%;background:var(--accent);color:var(--accent-t);display:grid;place-items:center;font-weight:800}
footer{border-top:1px solid var(--line);padding:28px 0;color:var(--muted);font-size:14px}
.f{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between}
.empty{color:var(--muted);padding:20px 0}
</style>
</head>
<body>
